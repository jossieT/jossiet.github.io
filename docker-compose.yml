services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: yosef-portfolio-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yosef_portfolio}
      POSTGRES_USER: ${POSTGRES_USER:-yosef}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yosef_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yosef} -d ${POSTGRES_DB:-yosef_portfolio}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: yosef-portfolio-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  backend:
    build:
      context: ./backend
    container_name: yosef-portfolio-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-yosef}:${POSTGRES_PASSWORD:-yosef_dev_password}@postgres:5432/${POSTGRES_DB:-yosef_portfolio}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
